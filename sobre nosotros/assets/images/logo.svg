<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" role="img" aria-label="ECOM Advisory">

  <!-- Icono: cuadrado blanco redondeado con la "e" estilizada -->
  <rect x="0" y="4" width="48" height="48" rx="10" fill="white"/>

  <!-- Letra "e" estilizada: arco + barra central (como en la captura del sitio) -->
  <!-- Arco exterior -->
  <path
    d="M24 14
       C16.268 14 10 20.268 10 28
       C10 35.732 16.268 42 24 42
       C28.8 42 33.04 39.52 35.52 35.76
       L30.8 32.96
       C29.2 35.44 26.8 36.8 24 36.8
       C20.16 36.8 16.96 34.24 15.84 30.8
       L37.6 30.8
       C37.84 29.92 38 28.96 38 28
       C38 20.268 31.732 14 24 14Z"
    fill="#0a49b0"
  />
  <!-- Barra horizontal que cruza el arco (característica de la "e" de ECOM) -->
  <rect x="14" y="25.5" width="23" height="3.2" rx="1.6" fill="#0a49b0"/>

  <!-- Texto "ecom" -->
  <text
    x="60"
    y="34"
    font-family="Montserrat, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="-0.3"
    fill="white"
  >ecom</text>

  <!-- Texto "ADVISORY" -->
  <text
    x="61"
    y="46"
    font-family="Inter, sans-serif"
    font-size="8"
    font-weight="500"
    letter-spacing="2.5"
    fill="rgba(255,255,255,0.65)"
  >ADVISORY</text>

</svg>
